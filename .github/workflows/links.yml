# Link check — ensure URLs in the repo do not 404
name: Link Check

on:
  pull_request:
    branches: [main, master]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --exclude 'kiro\.dev' --verbose --no-progress --root-dir . './**/*.md' './**/*.html'
          fail: true
