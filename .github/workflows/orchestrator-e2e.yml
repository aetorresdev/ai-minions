# E2E tests for orchestrator/ — requires Ollama on the runner (self-hosted by default).
#
# Prerequisites (one-time on the self-hosted machine):
#   1. Register a GitHub Actions self-hosted runner with labels: self-hosted, ollama
#      https://docs.github.com/en/actions/hosting-your-own-runners/adding-self-hosted-runners
#   2. Ollama listening at localhost:11434 (or set OLLAMA_HOST / OLLAMA_PORT on the runner env)
#   3. Recommended: ollama pull qwen2.5-coder:7b (workflow default; override via dispatch input)
#
# Suites executed (PR / blocking gate):
#   - npm run test:e2e        → standard Ollama E2E (skipStateMcp=true); DEV contract smoke defaults to maxIterations=2
#   - npm run test:e2e:strict → system-path MCP-on-disk (ORCH_MCP_TRANSPORT=direct + mcp-direct.py)
#
# Optional (workflow_dispatch only — not on PR critical path):
#   - npm run test:e2e:dev-first-shot-report → informational N runs with maxIterations=1
#     (was ~9 min of wall-clock on self-hosted with E2E_FIRST_SHOT_RUNS=5; keep available via dispatch)
#
# Fork PRs: this job is skipped when head repo ≠ base repo so the workflow does not wait forever
# for a runner that forks never receive. Same-repo PRs still run E2E when paths match
# (triggers: pull_request + workflow_dispatch only — no push trigger).
#
name: orchestrator-e2e

permissions:
  contents: read

concurrency:
  group: orchestrator-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      ollama_model:
        description: "Ollama model to use (default: qwen2.5-coder:7b)"
        required: false
        default: "qwen2.5-coder:7b"
      run_first_shot_report:
        description: "Run informational DEV first-shot metric (adds ~N×Ollama latency; non-blocking)"
        type: boolean
        required: false
        default: true
  pull_request:
    branches: [main, master]
    paths:
      - "orchestrator/orchestrator.js"
      - "orchestrator/agents.js"
      - "orchestrator/cli.js"
      - "orchestrator/run-orchestrator.js"
      - "orchestrator/mcp-direct.py"
      - "orchestrator/tests/**"
      - "orchestrator/scripts/**"
      - "orchestrator/package.json"
      - "orchestrator/package-lock.json"
      - "mcp-servers/orchestrator-state/**"
      - "mcp-servers/compact-handoff/**"
      - ".github/workflows/orchestrator-e2e.yml"

jobs:
  e2e:
    name: E2E + system-path (Ollama + MCP direct)
    runs-on: [self-hosted, ollama]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"

      - name: Install Node dependencies
        run: |
          cd orchestrator
          npm ci

      - name: Install MCP server dependencies (mcp-direct.py)
        run: |
          cd "${{ github.workspace }}/mcp-servers/orchestrator-state" && uv sync --quiet
          cd "${{ github.workspace }}/mcp-servers/compact-handoff" && uv sync --quiet

      - name: Verify Ollama is reachable
        run: |
          curl -sf http://localhost:11434/api/tags | \
            python3 -c "import sys,json; d=json.load(sys.stdin); models=[m['name'] for m in d.get('models',[])]; print('Available models:', models); sys.exit(0 if models else 1)"

      - name: Ensure workflow model is pulled (best-effort)
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.ollama_model || 'qwen2.5-coder:7b' }}
        run: |
          set -e
          if command -v ollama >/dev/null 2>&1; then
            if ! ollama list 2>/dev/null | grep -qF "$OLLAMA_MODEL"; then
              echo "Pulling $OLLAMA_MODEL …"
              ollama pull "$OLLAMA_MODEL" || echo "::warning::ollama pull failed — tests may skip if model unavailable"
            fi
          else
            echo "::notice::ollama CLI not on PATH — assuming model already present in daemon"
          fi

      - name: Run E2E suite (test:e2e)
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.ollama_model || 'qwen2.5-coder:7b' }}
        run: |
          cd orchestrator
          npm run test:e2e

      - name: DEV contract first-shot rate (informational, dispatch-only)
        # Non-blocking metric. Kept off the PR critical path: measured ~9m wall-clock for
        # 5 serial Ollama runs on the self-hosted runner. Use Actions → Run workflow for trends.
        if: github.event_name == 'workflow_dispatch' && inputs.run_first_shot_report
        continue-on-error: true
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.ollama_model || 'qwen2.5-coder:7b' }}
          E2E_FIRST_SHOT_RUNS: "5"
        run: |
          cd orchestrator
          npm run test:e2e:dev-first-shot-report

      - name: Run system-path E2E suite (MCP direct, no claude CLI for gates)
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.ollama_model || 'qwen2.5-coder:7b' }}
        run: |
          cd orchestrator
          npm run test:e2e:strict

      - name: Job summary
        if: always()
        env:
          OLLAMA_MODEL: ${{ github.event.inputs.ollama_model || 'qwen2.5-coder:7b' }}
        run: |
          {
            echo "## orchestrator-e2e"
            echo "- **Model:** \`$OLLAMA_MODEL\`"
            echo "- **Blocking suites:** \`npm run test:e2e\` → \`npm run test:e2e:strict\`"
            echo "- **First-shot metric:** workflow_dispatch only (input \`run_first_shot_report\`)"
            echo "- **Runner:** self-hosted, labels \`self-hosted\` + \`ollama\`"
            echo "- **On failure:** artifact \`e2e-failure-*\` uploads traces + npm-debug.log (if present)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            ~/.claude/metrics/traces/
            ~/.claude/metrics/gate_events.jsonl
            ~/.claude/metrics/flow-metrics.jsonl
            orchestrator/npm-debug.log
          retention-days: 7
          if-no-files-found: ignore
