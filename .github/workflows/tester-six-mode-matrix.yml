# Tester six-mode matrix — structure + credential-aware skip assessment.
# Manual / optional. Not a PR merge gate.
# Does not echo secret values. Hybrid rows always honest-skip.
name: Tester six-mode matrix

on:
  workflow_dispatch:
    inputs:
      probe_local:
        description: Probe OLLAMA_HOST/PORT reachability (still no live smoke)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tester-six-mode-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pass through secret presence only via shell test — never print values
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OLLAMA_HOST: ${{ vars.OLLAMA_HOST || '127.0.0.1' }}
      OLLAMA_PORT: ${{ vars.OLLAMA_PORT || '11434' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Credential presence notice (names only)
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY: present"
          else
            echo "ANTHROPIC_API_KEY: missing"
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY: present"
          else
            echo "OPENAI_API_KEY: missing"
          fi
          echo "Hybrid rows: always MATRIX_SKIP_HYBRID_UNSUPPORTED"
          echo "Remote rows without tokens: MATRIX_SKIP_REMOTE_CREDENTIALS_MISSING"
          echo "Local rows without reachable Ollama: MATRIX_SKIP_LOCAL_BACKEND_MISSING (when --probe-local)"

      - name: Structure + readiness assessment
        run: |
          set -euo pipefail
          mkdir -p mode-comparison-out
          if [ "${{ inputs.probe_local }}" = "true" ]; then
            node scripts/run-tester-six-mode-matrix.mjs --skip-live --probe-local --json | tee mode-comparison-out/matrix-assessment.json
            node scripts/generate-mode-comparison-report.mjs \
              --from-matrix-json mode-comparison-out/matrix-assessment.json \
              --out-dir mode-comparison-out
          else
            node scripts/run-tester-six-mode-matrix.mjs --skip-live --json | tee mode-comparison-out/matrix-assessment.json
            node scripts/generate-mode-comparison-report.mjs \
              --from-matrix-json mode-comparison-out/matrix-assessment.json \
              --out-dir mode-comparison-out
          fi

      - name: Upload mode comparison report
        uses: actions/upload-artifact@v4
        with:
          name: mode-comparison-report
          path: mode-comparison-out/
          if-no-files-found: error

      - name: Unit tests for matrix helpers
        run: node --test tests/run-tester-six-mode-matrix.test.mjs

      - name: Unit tests for mode comparison report
        run: node --test tests/mode-comparison-report.test.mjs
