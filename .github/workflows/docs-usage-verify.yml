# Deterministic validation of operator usage docs (no LLM).
name: Docs usage verify

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "docs/how-to/**"
      - "docs/orchestrator/token-hygiene-guide.md"
      - "docs/orchestrator/context-hygiene-signals.md"
      - "docs/orchestrator/README.md"
      - "orchestrator/context-hygiene-signals.js"
      - "orchestrator/orchestrator.js"
      - "scripts/bootstrap-preflight.mjs"
      - "install.sh"
      - "scripts/install-ai-minions.mjs"
      - "docs/orchestrator/local-backend-adapter-contract.md"
      - "docs/how-to/install-ollama-docker-paths.md"
      - "orchestrator/local-backend-adapter.js"
      - "orchestrator/install-model-config.js"
      - "orchestrator/runtime-preflight.js"
      - "docs/orchestrator/provider-runtime-preflight-contract.md"
      - "docs/orchestrator/provider-inference-profile-contract.md"
      - "docs/orchestrator/model-config-ownership.md"
      - "orchestrator/local-model-discovery.js"
      - "scripts/operator-preflight.mjs"
      - "scripts/inspect-run-evidence.mjs"
      - "scripts/collect-run-report.mjs"
      - "scripts/run-primary-smoke.mjs"
      - "scripts/audit-product-claims.mjs"
      - "scripts/run-fresh-clone-evidence.mjs"
      - "scripts/run-install-evidence.mjs"
      - "scripts/lib/operator-doc-claims.mjs"
      - "scripts/verify-usage-docs.mjs"
      - "tests/bootstrap-preflight.test.mjs"
      - "tests/install-ai-minions.test.mjs"
      - "tests/operator-preflight.test.mjs"
      - "tests/inspect-run-evidence.test.mjs"
      - "tests/collect-run-report.test.mjs"
      - "tests/primary-smoke.test.mjs"
      - "tests/audit-product-claims.test.mjs"
      - "tests/fresh-clone-evidence.test.mjs"
      - "tests/run-install-evidence.test.mjs"
      - ".github/workflows/docs-usage-verify.yml"
      - ".github/workflows/claude-doc-smoke.yml"
      - "orchestrator/operator-cli-help.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-usage-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-usage-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci

      - name: Verify usage how-to and README alignment
        run: node scripts/verify-usage-docs.mjs

      - name: Bootstrap preflight unit tests
        run: node --test tests/bootstrap-preflight.test.mjs

      - name: Install ai-minions unit tests
        run: node --test tests/install-ai-minions.test.mjs

      - name: Operator preflight bridge unit tests
        run: node --test tests/operator-preflight.test.mjs

      - name: Inspect run evidence unit tests
        run: node --test tests/inspect-run-evidence.test.mjs

      - name: Collect run report unit tests
        run: node --test tests/collect-run-report.test.mjs

      - name: Primary smoke unit tests
        run: node --test tests/primary-smoke.test.mjs

      - name: Product claim audit
        run: node scripts/audit-product-claims.mjs

      - name: Claim audit unit tests
        run: node --test tests/audit-product-claims.test.mjs

      - name: Fresh-clone evidence chain
        run: node scripts/run-fresh-clone-evidence.mjs

      - name: Install evidence chain (CI claim audit)
        run: node scripts/run-install-evidence.mjs --skip-live

      - name: Fresh-clone evidence unit tests
        run: node --test tests/fresh-clone-evidence.test.mjs

      - name: Install evidence unit tests
        run: node --test tests/run-install-evidence.test.mjs
