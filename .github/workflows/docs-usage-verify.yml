# Deterministic validation of operator usage docs (no LLM).
name: Docs usage verify

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "docs/how-to/**"
      - "docs/orchestrator/token-hygiene-guide.md"
      - "docs/orchestrator/context-hygiene-signals.md"
      - "docs/orchestrator/README.md"
      - "orchestrator/context-hygiene-signals.js"
      - "orchestrator/orchestrator.js"
      - "scripts/bootstrap-preflight.mjs"
      - "scripts/verify-usage-docs.mjs"
      - "tests/bootstrap-preflight.test.mjs"
      - ".github/workflows/docs-usage-verify.yml"
      - ".github/workflows/claude-doc-smoke.yml"
      - "orchestrator/operator-cli-help.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-usage-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-usage-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify usage how-to and README alignment
        run: node scripts/verify-usage-docs.mjs

      - name: Bootstrap preflight unit tests
        run: node --test tests/bootstrap-preflight.test.mjs
