# Deterministic validation of operator usage docs (no LLM).
name: Docs usage verify

on:
  pull_request:
    branches: [main, master]
    paths:
      - "README.md"
      - "docs/how-to/**"
      - "docs/orchestrator/token-hygiene-guide.md"
      - "docs/orchestrator/context-hygiene-signals.md"
      - "docs/orchestrator/README.md"
      - "orchestrator/context-hygiene-signals.js"
      - "orchestrator/orchestrator.js"
      - "scripts/bootstrap-preflight.mjs"
      - "install.sh"
      - "scripts/install-ai-minions.mjs"
      - "scripts/lib/ai-minions-cli-install.mjs"
      - "docs/orchestrator/local-backend-adapter-contract.md"
      - "docs/how-to/install-ollama-docker-paths.md"
      - "orchestrator/local-backend-adapter.js"
      - "orchestrator/install-model-config.js"
      - "orchestrator/runtime-preflight.js"
      - "docs/orchestrator/provider-runtime-preflight-contract.md"
      - "docs/orchestrator/provider-inference-profile-contract.md"
      - "docs/orchestrator/model-config-ownership.md"
      - "orchestrator/local-model-discovery.js"
      - "scripts/operator-preflight.mjs"
      - "scripts/inspect-run-evidence.mjs"
      - "scripts/collect-run-report.mjs"
      - "scripts/run-primary-smoke.mjs"
      - "scripts/audit-product-claims.mjs"
      - "scripts/run-fresh-clone-evidence.mjs"
      - "scripts/run-install-evidence.mjs"
      - "scripts/lib/installed-cli-evidence.mjs"
      - "scripts/run-beta-smoke-matrix.mjs"
      - "scripts/lib/beta-smoke-matrix-data.mjs"
      - "scripts/run-tester-six-mode-matrix.mjs"
      - "scripts/lib/tester-six-mode-matrix-data.mjs"
      - "scripts/verify-canonical-real-task-fixtures.mjs"
      - "scripts/lib/canonical-real-task-fixtures-data.mjs"
      - "scripts/generate-mode-comparison-report.mjs"
      - "scripts/lib/mode-comparison-report-data.mjs"
      - "scripts/lib/degraded-mode-evidence.mjs"
      - "scripts/lib/operator-doc-claims.mjs"
      - "scripts/verify-usage-docs.mjs"
      - "tests/bootstrap-preflight.test.mjs"
      - "tests/install-ai-minions.test.mjs"
      - "tests/install-ai-minions-cli-install.test.mjs"
      - "tests/install-ai-minions-preflight-security.test.mjs"
      - "tests/operator-preflight.test.mjs"
      - "tests/inspect-run-evidence.test.mjs"
      - "tests/collect-run-report.test.mjs"
      - "tests/primary-smoke.test.mjs"
      - "tests/audit-product-claims.test.mjs"
      - "tests/fresh-clone-evidence.test.mjs"
      - "tests/run-install-evidence.test.mjs"
      - "tests/installed-cli-evidence.test.mjs"
      - "tests/assert-docker-live-install-evidence.test.mjs"
      - "tests/run-beta-smoke-matrix.test.mjs"
      - "tests/run-tester-six-mode-matrix.test.mjs"
      - "tests/canonical-real-task-fixtures.test.mjs"
      - "tests/mode-comparison-report.test.mjs"
      - "tests/fixtures/canonical-tasks/**"
      - "tests/degraded-mode-evidence.test.mjs"
      - "docs/orchestrator/beta-limitations-onboarding-contract.md"
      - "scripts/run-beta-gate-hardening-evidence.mjs"
      - "scripts/run-beta-cohort-guard.mjs"
      - "scripts/lib/beta-cohort-guard-data.mjs"
      - "scripts/cohort-ux-friction-log.mjs"
      - "scripts/lib/cohort-ux-friction-log.mjs"
      - "scripts/run-modular-closeout-evidence.mjs"
      - "scripts/lib/modular-closeout-data.mjs"
      - "docs/how-to/beta-gate-hardening-evidence.md"
      - "docs/how-to/beta-cohort-guard.md"
      - "docs/orchestrator/beta-gate-hardening-verify-contract.md"
      - "docs/orchestrator/modular-closeout-evidence-contract.md"
      - "docs/orchestrator/architecture-coherence-audit.md"
      - "docs/orchestrator/root-file-inventory.md"
      - "docs/orchestrator/module-boundaries.md"
      - "tests/run-beta-gate-hardening-evidence.test.mjs"
      - "tests/run-beta-cohort-guard.test.mjs"
      - "tests/cohort-ux-friction-log.test.mjs"
      - "tests/run-modular-closeout-evidence.test.mjs"
      - "tests/beta-limitations-onboarding.test.mjs"
      - ".github/workflows/docs-usage-verify.yml"
      - ".github/workflows/tester-six-mode-matrix.yml"
      - ".gitignore"
      - ".github/workflows/claude-doc-smoke.yml"
      - "orchestrator/operator-cli-help.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-usage-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-usage-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci

      - name: Verify usage how-to and README alignment
        run: node scripts/verify-usage-docs.mjs

      - name: Bootstrap preflight unit tests
        run: node --test tests/bootstrap-preflight.test.mjs

      - name: Install ai-minions unit tests
        run: node --test tests/install-ai-minions.test.mjs tests/install-ai-minions-cli-install.test.mjs tests/install-ai-minions-preflight-security.test.mjs

      - name: Operator preflight bridge unit tests
        run: node --test tests/operator-preflight.test.mjs

      - name: Inspect run evidence unit tests
        run: node --test tests/inspect-run-evidence.test.mjs

      - name: Collect run report unit tests
        run: node --test tests/collect-run-report.test.mjs

      - name: Primary smoke unit tests
        run: node --test tests/primary-smoke.test.mjs

      - name: Product claim audit
        run: node scripts/audit-product-claims.mjs

      - name: Claim audit unit tests
        run: node --test tests/audit-product-claims.test.mjs

      - name: Fresh-clone evidence chain
        run: node scripts/run-fresh-clone-evidence.mjs

      - name: Install evidence chain (CI claim audit)
        run: node scripts/run-install-evidence.mjs --skip-live

      - name: Installed CLI evidence chain (CI shim gate)
        run: node scripts/run-install-evidence.mjs --installed-cli-ci --json

      - name: Beta smoke matrix structure gate
        run: node scripts/run-beta-smoke-matrix.mjs --skip-live

      - name: Tester six-mode matrix structure gate
        run: node scripts/run-tester-six-mode-matrix.mjs --skip-live

      - name: Canonical real-task fixtures structure gate
        run: node scripts/verify-canonical-real-task-fixtures.mjs

      - name: Mode comparison report structure gate
        run: node scripts/generate-mode-comparison-report.mjs --skip-live --json

      - name: Beta gate hardening evidence chain
        run: node scripts/run-beta-gate-hardening-evidence.mjs

      - name: Beta cohort guard evidence chain
        run: node scripts/run-beta-cohort-guard.mjs

      - name: Modular closeout evidence chain
        run: node scripts/run-modular-closeout-evidence.mjs

      - name: Fresh-clone evidence unit tests
        run: node --test tests/fresh-clone-evidence.test.mjs

      - name: Install evidence unit tests
        run: node --test tests/run-install-evidence.test.mjs tests/installed-cli-evidence.test.mjs tests/assert-docker-live-install-evidence.test.mjs

      - name: Beta smoke matrix unit tests
        run: node --test tests/run-beta-smoke-matrix.test.mjs

      - name: Tester six-mode matrix unit tests
        run: node --test tests/run-tester-six-mode-matrix.test.mjs

      - name: Canonical real-task fixtures unit tests
        run: node --test tests/canonical-real-task-fixtures.test.mjs

      - name: Mode comparison report unit tests
        run: node --test tests/mode-comparison-report.test.mjs

      - name: Beta gate hardening evidence unit tests
        run: node --test tests/run-beta-gate-hardening-evidence.test.mjs

      - name: Beta cohort guard unit tests
        run: node --test tests/run-beta-cohort-guard.test.mjs

      - name: Cohort UX friction log unit tests
        run: node --test tests/cohort-ux-friction-log.test.mjs

      - name: Modular closeout evidence unit tests
        run: node --test tests/run-modular-closeout-evidence.test.mjs

      - name: Degraded-mode evidence unit tests
        run: node --test tests/degraded-mode-evidence.test.mjs
