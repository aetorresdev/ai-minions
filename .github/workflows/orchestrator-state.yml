# Tests for mcp-servers/orchestrator-state (L2 store + gates; no Ollama required)
name: orchestrator-state

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mcp-servers/orchestrator-state/**"
      - ".github/workflows/orchestrator-state.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps and run tests
        run: |
          cd mcp-servers/orchestrator-state
          # Locked install (respects uv.lock + dependency-groups.dev / pytest).
          uv sync --frozen
          uv run pytest tests/ -v --tb=short
