# Tests for examples/orchestrator (unit + integration; no Claude auth or Ollama required)
name: orchestrator-example

on:
  push:
    branches: [main, master]
    paths:
      - "examples/orchestrator/**"
      - ".github/workflows/orchestrator-example.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "examples/orchestrator/**"
      - ".github/workflows/orchestrator-example.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: |
          cd examples/orchestrator
          node --test tests/*.test.js
