# Lint + unit tests for examples/orchestrator (no Claude auth or Ollama required).
# push: path-filtered to save CI on unrelated commits.
# pull_request: no path filter — every PR gets lint + unit.
name: orchestrator-example

on:
  push:
    branches: [main, master]
    paths:
      - "examples/orchestrator/**"
      - "scripts/hooks/**"
      - ".github/workflows/orchestrator-example.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify harness env name scope
        run: bash examples/orchestrator/scripts/ci-check-harness-scope.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd examples/orchestrator
          npm ci

      - name: Install Python linter
        run: pip install ruff

      - name: Lint + unit tests
        run: |
          cd examples/orchestrator
          npm test
