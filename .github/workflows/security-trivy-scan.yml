# Filesystem vulnerability + secret scan (published dependency scope).
# Uses aquasecurity/trivy-action — reports for CERBERUS + fail gate on HIGH/CRITICAL.
name: security-trivy-scan

on:
  pull_request:
    branches: [main, master]
    paths:
      - "mcp-servers/**"
      - "orchestrator/package.json"
      - "orchestrator/package-lock.json"
      - "scripts/release-trivy-gate.sh"
      - "tests/release-trivy-gate.test.mjs"
      - ".trivy.yaml"
      - ".gitignore"
      - ".github/workflows/security-trivy-scan.yml"
  push:
    branches: [main, master]
    paths:
      - "mcp-servers/**"
      - "orchestrator/package.json"
      - "orchestrator/package-lock.json"
      - "scripts/release-trivy-gate.sh"
      - "tests/release-trivy-gate.test.mjs"
      - ".trivy.yaml"
      - ".gitignore"
      - ".github/workflows/security-trivy-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate status contract tests
        run: node --test tests/release-trivy-gate.test.mjs

  trivy:
    runs-on: ubuntu-latest
    env:
      TRIVY_SKIP_DIRS: plugins,projects,cache,downloads,.state,telemetry,sessions,node_modules,.git,.cursor,debug,backups
      TRIVY_SKIP_FILES: "**/*.jsonl"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Regenerate MCP lockfiles
        run: |
          for dir in mcp-servers/compact-handoff mcp-servers/orchestrator-state; do
            (cd "$dir" && uv lock)
          done

      - name: Verify MCP lockfiles are committed
        run: |
          git diff --exit-code -- \
            mcp-servers/compact-handoff/uv.lock \
            mcp-servers/orchestrator-state/uv.lock

      - name: Prepare report directory
        run: mkdir -p trivy-reports

      # Scope guard: the lockfile ships the full dependency tree, so the scan must
      # include devDependencies. A config regression here would silently under-report
      # (false PASS) — fail the job before any report is produced.
      - name: Verify dev-dependencies scanning is enabled
        run: |
          awk '
            /^[[:space:]]*#/ { next }
            /^pkg:[[:space:]]*$/ { in_pkg=1; next }
            /^[A-Za-z]/ { in_pkg=0 }
            in_pkg && $1 == "include-dev-deps:" && $2 == "true" { found=1 }
            END { exit(found ? 0 : 1) }
          ' .trivy.yaml || {
            echo "::error::.trivy.yaml must set pkg.include-dev-deps: true — devDependency findings would be silently excluded"
            exit 1
          }

      - name: Trivy report (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          scanners: vuln,secret
          ignore-unfixed: true
          format: json
          output: trivy-reports/report.json
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          skip-files: ${{ env.TRIVY_SKIP_FILES }}
          exit-code: "0"

      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          scanners: vuln,secret
          ignore-unfixed: true
          format: sarif
          output: trivy-reports/report.sarif
          limit-severities-for-sarif: true
          severity: HIGH,CRITICAL
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          skip-files: ${{ env.TRIVY_SKIP_FILES }}
          exit-code: "0"
          skip-setup-trivy: true

      - name: Trivy report (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          scanners: vuln,secret
          ignore-unfixed: true
          format: table
          output: trivy-reports/report.txt
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          skip-files: ${{ env.TRIVY_SKIP_FILES }}
          exit-code: "0"
          skip-setup-trivy: true

      - name: Job summary for reviewers
        if: always() && hashFiles('trivy-reports/report.txt') != ''
        run: |
          {
            echo "## Trivy security scan (published scope)"
            echo ""
            echo "Workflow: \`security-trivy-scan\` · Action: \`aquasecurity/trivy-action\` · Scanners: vuln, secret"
            echo ""
            echo "Artifact: \`trivy-security-report\` (txt / json / sarif)"
            echo ""
            cat trivy-reports/report.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          scanners: vuln,secret
          ignore-unfixed: true
          format: table
          severity: HIGH,CRITICAL
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          skip-files: ${{ env.TRIVY_SKIP_FILES }}
          exit-code: "1"
          skip-setup-trivy: true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-reports/
          retention-days: 30
          if-no-files-found: ignore
