# Lint + unit tests for orchestrator/ (no Claude auth or Ollama required).
# pull_request only — gates merge; no push-to-master runs (merge already validated on PR).
# Manual: workflow_dispatch (e.g. post-merge spot-check).
name: orchestrator-unit-tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify harness env name scope
        run: bash orchestrator/scripts/ci-check-harness-scope.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd orchestrator
          npm ci

      - name: Install Python linter
        run: pip install ruff

      - name: Lint + unit tests
        run: |
          cd orchestrator
          npm test
