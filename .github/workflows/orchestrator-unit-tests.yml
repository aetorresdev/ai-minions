# Lint + unit tests for orchestrator/ (no Claude auth or Ollama required).
# push: path-filtered to save CI on unrelated commits.
# pull_request: no path filter — every PR gets lint + unit.
name: orchestrator-unit-tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "orchestrator/**"
      - "scripts/hooks/**"
      - "scripts/lib/node-runtime-policy.cjs"
      - ".github/workflows/orchestrator-unit-tests.yml"
  workflow_dispatch:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v6

      - name: Verify harness env name scope
        run: bash orchestrator/scripts/ci-check-harness-scope.sh

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd orchestrator
          npm ci

      - name: Install Python linter
        run: pip install ruff

      - name: Lint + unit tests
        run: |
          cd orchestrator
          npm test

      - name: Operator TUI MVP quality gate
        run: |
          cd orchestrator
          npm run test:tui-quality

      - name: Routing release smoke (fixture)
        run: |
          cd orchestrator
          mkdir -p ../artifacts/routing-release
          ROUTING_RELEASE_MODE=fixture \
          ROUTING_RELEASE_ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts/routing-release" \
          ROUTING_RELEASE_COMMIT_SHA="$GITHUB_SHA" \
          npm run test:e2e:routing-release

      - name: Upload routing-release fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-release-fixture-node${{ matrix.node-version }}-${{ github.sha }}
          path: artifacts/routing-release/
          if-no-files-found: warn
          retention-days: 14
