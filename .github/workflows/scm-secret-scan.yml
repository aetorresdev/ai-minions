# SCM secret scan: Git history, not just the checked-out tree.
# Contract: docs/orchestrator/scm-secret-scan-contract.md
# - PR scope: every commit in base..head (catches add-then-delete inside a PR).
# - Release scope: all history reachable from the candidate ref.
# Fails closed: a missing or unverified scanner, shallow history or a scanner
# error is BLOCKED (exit 2), never PASS.
name: scm-secret-scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release candidate ref (tag, branch or SHA)"
        required: false
        default: ""

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scm-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"

      - name: Contract tests (planted-secret fixtures)
        env:
          SCM_SECRET_SCAN_REQUIRE_SCANNER: "1"
        run: node --test tests/scm-secret-scan.test.mjs

      - name: PR scope (base..head commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/scm-secret-scan.mjs --scope pr --base "$BASE_SHA" --head "$HEAD_SHA" --out scm-secret-scan/pr.json

      - name: Release scope (history reachable from candidate)
        if: ${{ !cancelled() }}
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
        run: node scripts/scm-secret-scan.mjs --scope release --ref "$CANDIDATE" --out scm-secret-scan/release.json

      - name: Job summary (normalized evidence only)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## SCM secret scan"
            echo ""
            echo "| Scope | Status | Reason | Scanner | Commit | Commits | Findings | Suppressed |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
            for f in scm-secret-scan/*.json; do
              [ -f "$f" ] || continue
              node -e '
                const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const r = e.result;
                console.log(`| ${e.scope} | ${r.status} | ${r.reason_code} | ${e.scanner.name}@${e.scanner.version} | ${e.source.commit_hash} | ${e.source.commits_scanned} | ${r.findings_total} | ${r.suppressed_total} |`);
              ' "$f"
            done
            echo ""
            echo "Findings list rule, commit, file and line only; values are never recorded. Artifact: \`scm-secret-scan-evidence\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scm-secret-scan-evidence
          path: scm-secret-scan/
          retention-days: 30
          if-no-files-found: error
