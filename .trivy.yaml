# Published release dependency scope — see docs/orchestrator/security-posture.md
# Local: trivy fs --scanners vuln,secret --ignore-unfixed .
# CI: .github/workflows/security-trivy-scan.yml (aquasecurity/trivy-action)

severity:
  - HIGH
  - CRITICAL

# Dev dependencies are part of the shipped lockfile scope — scanning only
# production deps hides real findings (npm audit --omit=dev blind spot).
# scripts/release-trivy-gate.sh refuses PASS when this flag is missing.
pkg:
  include-dev-deps: true

scan:
  skip-dirs:
    - plugins
    - projects
    - cache
    - downloads
    - .state
    - telemetry
    - sessions
    - node_modules
    - .git
    - .cursor
    - debug
    - backups
  skip-files:
    - "**/*.jsonl"
